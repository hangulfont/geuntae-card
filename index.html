<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>근태카드</title>
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근태카드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column time-card app — calendar on top, punch card below; team tab = shared overtime calendar + table */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e8ecea; --line:#d3dad7;
  --fg:#17211e; --muted:#5d6b66;
  --in:#0f6b5c; --in-soft:#d7ece7;
  --out:#2d4a8a; --out-soft:#dde4f3;
  --ot:#b35f10; --ot-soft:#f7e6d2;
  --leave:#7a4f9a; --leave-soft:#ece1f4;
  --sun:#c2352b; --sat:#2d5bb3;
  --hw:#a3263f; --hw-soft:#f6dde2;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111816; --surface:#19221f; --surface-2:#222d2a; --line:#33403c;
  --fg:#e6ece9; --muted:#9aa8a3;
  --in:#4fc0a8; --in-soft:#173a33; --out:#8fa9e8; --out-soft:#1d2840;
  --ot:#f0a24f; --ot-soft:#3b2a17; --leave:#c69be6; --leave-soft:#2f2340;
  --sun:#ff7d72; --sat:#82a8f5; --hw:#ff8fa3; --hw-soft:#3d1e26; color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px}
.brand div{display:flex;flex-direction:column;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.tabs{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--sun);color:#fff;font-size:11px;padding:0 5px;margin-left:4px;text-align:center}

.banner{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--ot-soft);color:var(--fg);border:1px solid var(--line)}
.banner b{color:var(--ot)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* gate screens (login / pending / setup) */
.gate{max-width:440px;margin:8vh auto 0;padding:28px 22px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.gate img{width:64px;height:64px}
.gate h2{margin:0;font-size:24px}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate .mail{font-family:var(--mono);color:var(--fg);font-size:14px;background:var(--surface-2);padding:6px 10px;border-radius:8px;word-break:break-all}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-weight:600;font-size:16px}
.gbtn svg{width:20px;height:20px}
.gate-form{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.gate-form label{font-size:13px;font-weight:600;color:var(--muted)}
.gate-form input{font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.whoami-btn{border:0;background:none;padding:0;font-size:13px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.whoami-btn b{color:var(--fg);font-weight:600}
.inapp{font-size:13px;text-align:left;background:var(--ot-soft);border-radius:10px;padding:10px 12px;width:100%}
.inapp button{margin-top:8px}
.small{font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px}

/* punch card */
.punch{padding:18px;display:flex;flex-direction:column;gap:16px}
#viewing{order:0} .cal{order:1} #punch{order:2}
.punch-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.today-label{font-size:13px;color:var(--muted);letter-spacing:.02em}
.clock{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.site-chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-chip b{color:var(--fg);font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pbtn{border:0;border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:112px;justify-content:center;transition:transform .08s}
.pbtn:active{transform:scale(.98)}
.pbtn svg{width:30px;height:30px}
.pbtn .lbl{font-size:18px;font-weight:700}
.pbtn .sub{font-size:13px;opacity:.85}
.pbtn.in{background:var(--in);color:#fff}
.pbtn.out{background:var(--out);color:#fff}
.pbtn.done{background:var(--surface-2);color:var(--fg)}
.pbtn.done .lbl{font-family:var(--mono);font-size:22px}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.stamp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.stamp-row button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px}

/* calendar */
.cal{padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head h2{margin:0;font-size:17px;font-weight:700}
.nav{display:flex;gap:4px}
.nav button{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;font-size:16px}
.nav button.t{width:auto;padding:0 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;text-align:center;color:var(--muted);padding:2px 0;font-weight:600}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.day{min-height:78px;border-radius:8px;background:var(--surface-2);border:1px solid transparent;padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;overflow:hidden}
.day.blank{background:transparent;cursor:default}
.day.today{border-color:var(--in)}
.day .d{font-size:12px;font-weight:700}
.day.sun .d,.day.hol .d{color:var(--sun)} .day.sat .d{color:var(--sat)}
.day .hn{font-size:10px;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-in,.t-out{font-family:var(--mono);font-size:11px;line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums}
.t-in{color:var(--in)} .t-out{color:var(--out)}
.pill{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 4px;align-self:flex-start;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.ot{background:var(--ot-soft);color:var(--ot)}
.pill.lv{background:var(--leave-soft);color:var(--leave)}
.pill.live{background:var(--in-soft);color:var(--in)}
.pill.hw{background:var(--hw-soft);color:var(--hw)}
.who-ot.hw{background:var(--hw-soft);color:var(--hw)}
.sum .h strong{color:var(--hw)}
.leave-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:-6px}
.leave-row span{margin-right:2px}
.leave-row button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.leave-row button[aria-pressed="true"]{background:var(--leave);border-color:var(--leave);color:#fff}
.leave-row button:disabled{opacity:.45;cursor:not-allowed}
/* others on the calendar: who did how many hours */
.day{min-height:92px}
.who-ot{display:flex;justify-content:space-between;gap:2px;font-size:10.5px;line-height:1.3;background:var(--ot-soft);color:var(--ot);border-radius:4px;padding:1px 4px;min-width:0}
.who-ot .nm{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.who-ot b{font-family:var(--mono);font-weight:600;flex:none}
.who-lv{font-size:10.5px;line-height:1.3;background:var(--leave-soft);color:var(--leave);border-radius:4px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{font-size:10px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
@media (max-width:420px){.day{min-height:68px;padding:3px}.day{min-height:84px}.t-in,.t-out{font-size:10px}.clock{font-size:34px}.who-ot,.who-lv{font-size:9.5px;padding:1px 2px}
  .lw{display:none}
  .who-ot{flex-direction:column;gap:0;line-height:1.2}
  .who-ot .nm,.who-lv .nm{text-overflow:clip}
  .who-lv{white-space:normal;line-height:1.2}
  .who-lv .nm{display:block;overflow:hidden;white-space:nowrap}}

.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.sum div{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.sum small{display:block;font-size:12px;color:var(--muted)}
.sum strong{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.sum .o strong{color:var(--ot)}
@media (max-width:420px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:500}

/* team table */
.team{padding:14px;display:flex;flex-direction:column;gap:10px}
.team h2{margin:0;font-size:17px}
.team-note{font-size:13px;color:var(--muted);margin:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num{text-align:right} th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.status{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.status.working{background:var(--in-soft);color:var(--in)}
.status.left{background:var(--out-soft);color:var(--out)}
.status.none{background:var(--surface-2);color:var(--muted)}
.status.lv{background:var(--leave-soft);color:var(--leave)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}
.viewing{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;background:var(--out-soft);border-radius:10px;padding:8px 12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-size:18px}
.sheet .hint{font-size:13px;color:var(--muted);margin:-8px 0 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--ot);border-color:var(--ot);color:#fff}
.chips.types button{font-family:var(--font)}
.chips.types button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.stepper output{font-family:var(--mono);font-size:26px;font-weight:600;min-width:90px;text-align:center;color:var(--ot)}
.suggest{font-size:13px;color:var(--muted)}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.primary{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--out);color:#fff}
.primary.green{background:var(--in)}
.danger{border:1px solid var(--line);background:transparent;color:var(--sun);border-radius:10px;padding:11px 14px;margin-right:auto}
.list{display:flex;flex-direction:column;gap:6px}
.list .it{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0}
.list .it span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px}
.daylist td{font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.copybox{width:100%;min-height:160px;font-family:var(--mono);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- 로그인 / 승인 대기 / 최초 설정 화면 -->
<section id="gate" class="card gate" hidden>
  <img src="icon.svg" alt="">
  <h2 id="gate-title">근태카드</h2>
  <p id="gate-msg">출근·퇴근과 잔업을 기록하려면 로그인하세요.<br>한 번 로그인하면 로그아웃할 때까지 유지됩니다.</p>
  <div id="gate-mail" class="mail" hidden></div>
  <form id="gate-name" class="gate-form" hidden>
    <label for="gate-name-input">이름 (달력과 팀 현황에 표시됩니다)</label>
    <input id="gate-name-input" type="text" maxlength="20" placeholder="예: 김상주" autocomplete="name" required>
    <button id="btn-request" class="primary green" type="submit">승인 요청 보내기</button>
  </form>
  <div id="inapp" class="inapp" hidden></div>
  <button id="btn-google" class="gbtn" hidden>
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Google 계정으로 로그인
  </button>
  <button id="btn-setup" class="primary green" hidden>내 계정을 관리자로 등록</button>
  <button id="btn-gate-logout" class="linkbtn" hidden>다른 계정으로 로그인</button>
  <p class="small" id="gate-foot"></p>
</section>

<div id="app" class="wrap" hidden>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt=""><div><h1>근태카드</h1><button id="whoami" class="whoami-btn" type="button" title="이름 바꾸기"></button></div></div>
    <div class="tabs" role="tablist">
      <button id="tab-me" role="tab" aria-selected="true">내 근태</button>
      <button id="tab-team" role="tab" aria-selected="false">팀 현황<span id="req-badge" class="badge" hidden></span></button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section id="view-me" class="wrap">
    <div id="viewing" class="viewing" hidden></div>
    <div class="card cal">
      <div class="cal-head">
        <h2 id="month-title"></h2>
        <div class="nav">
          <button class="prev" aria-label="이전 달">‹</button>
          <button class="this-month t">이번 달</button>
          <button class="next" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="grid dows"></div>
      <div class="grid" id="days" style="margin-top:4px"></div>
      <div class="legend"><span style="--c:var(--in-soft)">내 출근·퇴근</span><span style="--c:var(--ot-soft)">이름 · 잔업 시간</span><span style="--c:var(--hw-soft)">특근(주말·공휴일)</span><span style="--c:var(--leave-soft)">연차·반차</span></div>
      <div class="sum" id="sum"></div>
      <div class="row-actions"><button class="ghost" id="btn-copy">월간 근태 텍스트 복사</button></div>
    </div>
    <div class="card punch" id="punch">
      <div class="punch-head">
        <div>
          <div class="today-label" id="today-label"></div>
          <div class="clock" id="clock">--:--</div>
        </div>
        <button class="site-chip" id="site-chip">고객사 <b id="site-name">미지정</b> ✎</button>
      </div>
      <div class="leave-row" id="leave-row" role="group" aria-label="오늘 휴가">
        <span>오늘 휴가</span>
        <button data-type="am" aria-pressed="false">오전반차</button>
        <button data-type="pm" aria-pressed="false">오후반차</button>
        <button data-type="leave" aria-pressed="false">연차</button>
      </div>
      <div class="btns">
        <button class="pbtn in" id="btn-in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          <span class="lbl">출근</span><span class="sub">누르면 현재 시각 기록</span>
        </button>
        <button class="pbtn out" id="btn-out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span class="lbl">퇴근</span><span class="sub">잔업 시간 선택</span>

      <div class="stamp-row" id="stamp-row"></div>

  <section id="view-team" class="wrap" hidden>
    <div class="card team">
      <h2 id="team-title">팀 현황</h2>
      <p class="team-note">출근·퇴근을 누르면 바로 반영됩니다. 이름을 누르면 그 사람의 달력을 봅니다.</p>
      <div class="tbl-wrap"><table>

        <tbody id="team-body"></tbody>
      </table></div>
      <div class="row-actions" id="admin-row" hidden><button class="ghost" id="btn-members">멤버 관리</button></div>

</div>
